<div class="player" data-youtube="{{ include.film.youtube }}" data-title="{{ include.film.title | escape }}">
  <img src="{{ include.film.thumb }}" alt="" width="1280" height="720"{% unless include.eager %} loading="lazy"{% endunless %}>
  <button type="button" class="play" aria-label="Play {{ include.film.title | escape }}">
    <span class="play-dot" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>
  </button>
</div>
