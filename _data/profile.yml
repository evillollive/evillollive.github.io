job_title: Producer, director and writer
summary: >-
  Alex Perrault is a producer, director and writer based in Seattle. He makes doc style
  films for brands about people who love what they do, and specializes in getting real
  people to tell their best stories on camera. Most recently he was Senior Creative
  Producer at GitHub Films, working with the developers and maintainers behind open source
  software. Before that he led video at Designit, making films for Microsoft, Amazon, Acer
  and others. He started in broadcast and documentary and is a Daytime Emmy nominee.
  He is available to work as a local in Seattle, Los Angeles, New York and London.
